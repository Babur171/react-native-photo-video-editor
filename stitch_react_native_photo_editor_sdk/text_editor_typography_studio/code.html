<script>
  (function() {
    // Quick micro-interactions for font cards
    const fontButtons = document.querySelectorAll('button[style*="font-family"], button span[style*="font-family"]');
    const previewText = document.getElementById('preview-text');

    // Simple drag sensation feedback
    const textBox = document.getElementById('active-text-box');
    if (textBox) {
      let isDragging = false;
      let startY, startX;

      textBox.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });

      textBox.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        // visual response hint
        textBox.classList.add('scale-[1.02]');
      }, { passive: true });

      textBox.addEventListener('touchend', () => {
        isDragging = false;
        textBox.classList.remove('scale-[1.02]');
      });
    }
  })();
</script></main><div class="w-full pb-safe bg-transparent absolute bottom-0 inset-x-0 z-50 pointer-events-none flex justify-center py-space-xs"><div class="w-32 h-1 bg-surface-bright rounded-full"></div></div></body></html>
