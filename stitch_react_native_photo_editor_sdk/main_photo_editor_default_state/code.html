<script>
  (function initPhotoEditorStudio() {
    const compareBtn = document.getElementById('btn-compare');
    const canvasImg = document.getElementById('main-canvas-img');
    const toast = document.getElementById('toast-indicator');
    const toastText = document.getElementById('toast-text');
    let toastTimeout = null;

    function showToast(message) {
      if (!toast || !toastText) return;
      toastText.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1600);
    }

    if (compareBtn && canvasImg) {
      const showOriginal = () => {
        canvasImg.style.filter = 'grayscale(100%) contrast(85%)';
        showToast('Comparing: Raw Capture');
      };
      const showCurrent = () => {
        canvasImg.style.filter = 'none';
      };

      compareBtn.addEventListener('mousedown', showOriginal);
      window.addEventListener('mouseup', showCurrent);
      compareBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        showOriginal();
      }, { passive: false });
      window.addEventListener('touchend', showCurrent);
    }

    document.querySelectorAll('.quick-chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const actionLabel = chip.querySelector('span:nth-child(2)')?.textContent || 'Filter';
        showToast(actionLabel + ' applied');
      });
    });

    document.querySelectorAll('.tool-node').forEach((tool) => {
      tool.addEventListener('click', () => {
        const label = tool.querySelector('span:last-child')?.textContent || 'Tool';
        showToast('Switched to ' + label);
      });
    });
  })();
</script></main><div class="w-full pb-safe bg-transparent absolute bottom-0 inset-x-0 z-50 pointer-events-none flex justify-center py-space-xs"><div class="w-32 h-1 bg-surface-bright rounded-full"></div></div></body></html>
