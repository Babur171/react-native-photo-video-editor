<script>
  // Micro-interaction for Asset Item Selection
  const gridCards = document.querySelectorAll('.grid > div');
  gridCards.forEach(card => {
    card.addEventListener('click', () => {
      gridCards.forEach(c => {
        c.classList.remove('bg-surface-container-high');
        c.classList.add('bg-surface-container');
        const dot = c.querySelector('.bg-primary-container');
        if (dot && dot.parentElement === c) dot.remove();
      });
      card.classList.remove('bg-surface-container');
      card.classList.add('bg-surface-container-high');
      
      const indicator = document.createElement('div');
      indicator.className = 'absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-primary-container animate-ping';
      card.appendChild(indicator);
      setTimeout(() => indicator.classList.remove('animate-ping'), 600);
    });
  });
</script></main><div class="w-full pb-safe bg-transparent absolute bottom-0 inset-x-0 z-50 pointer-events-none flex justify-center py-space-xs"><div class="w-32 h-1 bg-surface-bright rounded-full"></div></div></body></html>
