<script>
  (function() {
    const sizeSlider = document.getElementById('brush-size-input');
    const sizePill = document.getElementById('size-val-pill');
    const sizeInc = document.getElementById('size-inc');
    const sizeDec = document.getElementById('size-dec');
    const reticleCircle = document.getElementById('reticle-circle');
    const mask = document.getElementById('active-mask');
    const btnMainErase = document.getElementById('btn-main-erase');
    const btnResetTop = document.getElementById('btn-reset-top');
    const btnClearMask = document.getElementById('btn-clear-mask');
    const btnInvertMask = document.getElementById('btn-invert-mask');
    const btnCompare = document.getElementById('btn-compare');
    const originalBadge = document.getElementById('original-badge');
    const aiToggleBtn = document.getElementById('ai-toggle-btn');
    const aiToggleTrack = document.getElementById('ai-toggle-track');
    const aiToggleDot = document.getElementById('ai-toggle-dot');
    const tabSmart = document.getElementById('tab-smart');
    const tabLasso = document.getElementById('tab-lasso');

    // Update Brush Preview & Label
    function updateBrushSize(val) {
      const clamped = Math.max(10, Math.min(120, parseInt(val, 10)));
      sizeSlider.value = clamped;
      sizePill.textContent = clamped + ' px';
      if (reticleCircle) {
        reticleCircle.style.width = clamped + 'px';
        reticleCircle.style.height = clamped + 'px';
      }
    }

    if (sizeSlider) {
      sizeSlider.addEventListener('input', (e) => updateBrushSize(e.target.value));
    }
    if (sizeInc) {
      sizeInc.addEventListener('click', () => updateBrushSize(parseInt(sizeSlider.value, 10) + 5));
    }
    if (sizeDec) {
      sizeDec.addEventListener('click', () => updateBrushSize(parseInt(sizeSlider.value, 10) - 5));
    }

    // Toggle Mode Tabs
    if (tabSmart && tabLasso) {
      tabSmart.addEventListener('click', () => {
        tabSmart.classList.add('bg-surface-container-highest', 'text-on-surface');
        tabSmart.classList.remove('text-on-surface-variant');
        tabLasso.classList.remove('bg-surface-container-highest', 'text-on-surface');
        tabLasso.classList.add('text-on-surface-variant');
      });
      tabLasso.addEventListener('click', () => {
        tabLasso.classList.add('bg-surface-container-highest', 'text-on-surface');
        tabLasso.classList.remove('text-on-surface-variant');
        tabSmart.classList.remove('bg-surface-container-highest', 'text-on-surface');
        tabSmart.classList.add('text-on-surface-variant');
      });
    }

    // Toggle Auto Detect
    let aiActive = true;
    if (aiToggleBtn) {
      aiToggleBtn.addEventListener('click', () => {
        aiActive = !aiActive;
        if (aiActive) {
          aiToggleTrack.classList.add('bg-primary-container');
          aiToggleTrack.classList.remove('bg-surface-container-highest');
          aiToggleDot.style.transform = 'translateX(0)';
        } else {
          aiToggleTrack.classList.remove('bg-primary-container');
          aiToggleTrack.classList.add('bg-surface-container-highest');
          aiToggleDot.style.transform = 'translateX(-16px)';
        }
      });
    }

    // Erase Simulation Action
    function triggerErase() {
      if (!mask) return;
      btnMainErase.classList.add('opacity-75', 'pointer-events-none');
      mask.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
      mask.style.opacity = '0';
      mask.style.transform = 'scale(1.08)';
      setTimeout(() => {
        btnMainErase.classList.remove('opacity-75', 'pointer-events-none');
      }, 700);
    }

    if (btnMainErase) btnMainErase.addEventListener('click', triggerErase);
    const btnTopErase = document.getElementById('btn-erase-top');
    if (btnTopErase) btnTopErase.addEventListener('click', triggerErase);

    // Reset Mask
    function restoreMask() {
      if (mask) {
        mask.style.opacity = '1';
        mask.style.transform = 'scale(1)';
      }
    }
    if (btnResetTop) btnResetTop.addEventListener('click', restoreMask);
    if (btnClearMask) btnClearMask.addEventListener('click', () => {
      if (mask) mask.style.opacity = '0';
    });

    // Invert Mask Mock Interaction
    let inverted = false;
    if (btnInvertMask) {
      btnInvertMask.addEventListener('click', () => {
        inverted = !inverted;
        if (mask) {
          mask.style.filter = inverted ? 'invert(1) hue-rotate(180deg)' : 'none';
        }
      });
    }

    // Compare / Peek Original
    if (btnCompare) {
      const showOriginal = () => {
        if (mask) mask.style.visibility = 'hidden';
        if (originalBadge) originalBadge.classList.remove('hidden');
      };
      const hideOriginal = () => {
        if (mask) mask.style.visibility = 'visible';
        if (originalBadge) originalBadge.classList.add('hidden');
      };
      btnCompare.addEventListener('mousedown', showOriginal);
      btnCompare.addEventListener('mouseup', hideOriginal);
      btnCompare.addEventListener('touchstart', showOriginal);
      btnCompare.addEventListener('touchend', hideOriginal);
    }
  })();
</script></main><div class="w-full pb-safe bg-transparent absolute bottom-0 inset-x-0 z-50 pointer-events-none flex justify-center py-space-xs"><div class="w-32 h-1 bg-surface-bright rounded-full"></div></div></body></html>
