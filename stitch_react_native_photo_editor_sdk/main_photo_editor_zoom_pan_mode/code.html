<script>
  // Simple micro-interactions for the editor preview state
  const zoomStage = document.getElementById('zoomStage');
  const resetBtn = document.getElementById('resetZoomBtn');
  const lockBtn = document.getElementById('lockPanBtn');
  let isZoomed = true;
  let isLocked = false;

  resetBtn?.addEventListener('click', () => {
    if (isZoomed) {
      zoomStage.style.transform = 'scale(1.0) translate(0, 0)';
      resetBtn.innerHTML = '<span class="material-symbols-outlined text-[15px] text-primary">zoom_in</span><span class="font-label-sm text-label-sm">Zoom (240%)</span>';
      isZoomed = false;
    } else {
      zoomStage.style.transform = 'scale(2.4)';
      resetBtn.innerHTML = '<span class="material-symbols-outlined text-[15px] text-primary">zoom_out_map</span><span class="font-label-sm text-label-sm">Reset (100%)</span>';
      isZoomed = true;
    }
  });

  lockBtn?.addEventListener('click', () => {
    isLocked = !isLocked;
    if (isLocked) {
      lockBtn.classList.replace('bg-surface-container', 'bg-primary-container');
      lockBtn.classList.replace('text-on-surface-variant', 'text-on-primary-container');
      lockBtn.innerHTML = '<span class="material-symbols-outlined text-[15px]">lock</span><span class="font-label-sm text-label-sm">Locked</span>';
    } else {
      lockBtn.classList.replace('bg-primary-container', 'bg-surface-container');
      lockBtn.classList.replace('text-on-primary-container', 'text-on-surface-variant');
      lockBtn.innerHTML = '<span class="material-symbols-outlined text-[15px]">lock_open</span><span class="font-label-sm text-label-sm">Lock Pan</span>';
    }
  });
</script></main><div class="w-full pb-safe bg-transparent absolute bottom-0 inset-x-0 z-50 pointer-events-none flex justify-center py-space-xs"><div class="w-32 h-1 bg-surface-bright rounded-full"></div></div></body></html>
