    function updateIntensity() {
      const val = intensitySlider.value;
      intensityPill.textContent = val + '%';
      presetActiveLabel.textContent = currentPresetName + ' · ' + val + '%';
      
      // Scale visual intensity through opacity blend
      if (currentFilterStyle) {
        const opacityRatio = val / 100;
        canvasImg.style.filter = currentFilterStyle;
        canvasImg.style.opacity = Math.max(0.6, 0.6 + 0.4 * opacityRatio);
      } else {
        canvasImg.style.filter = 'none';
        canvasImg.style.opacity = '1';
      }

      // Update badge if active preset matches
      const activeBadge = document.querySelector('.preset-card.active-preset .preset-badge');
      if (activeBadge) {
        activeBadge.textContent = val + '%';
      }
    }

    intensitySlider.addEventListener('input', updateIntensity);

    // Preset Selection Micro-interaction
    presetCards.forEach(card => {
      card.addEventListener('click', () => {
        presetCards.forEach(c => {
          c.classList.remove('active-preset');
          const previewDiv = c.querySelector('div');
          previewDiv.className = 'relative w-16 h-16 rounded-xl overflow-hidden bg-surface-container-highest shadow-sm transition-all group-active:scale-95';
          const title = c.querySelector('span');
          if (title) {
            title.className = 'font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors';
          }
          const badge = c.querySelector('.preset-badge');
          if (badge) badge.remove();
        });

        card.classList.add('active-preset');
        const previewDiv = card.querySelector('div');
        previewDiv.className = 'relative w-16 h-16 rounded-xl overflow-hidden shadow-lg p-space-2xs bg-primary-container transition-all group-active:scale-95';
        
        const title = card.querySelector('span');
        if (title) {
          title.className = 'preset-title font-label-sm text-label-sm text-primary font-bold';
        }

        // Add dynamic badge
        const badge = document.createElement('div');
        badge.className = 'preset-badge absolute bottom-1 right-1 bg-primary text-on-primary font-numeric-pill text-[10px] px-1 rounded-sm shadow-sm';
        badge.textContent = intensitySlider.value + '%';
        previewDiv.appendChild(badge);

        currentPresetName = card.getAttribute('data-name');
        currentFilterStyle = card.getAttribute('data-style');
        updateIntensity();
      });
    });

    // Tap-and-hold compare
    let originalFilterBackup = '';
    btnCompare.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      originalFilterBackup = canvasImg.style.filter;
      canvasImg.style.filter = 'none';
      btnCompare.classList.add('bg-primary', 'text-on-primary');
    });

    const resetCompare = () => {
      canvasImg.style.filter = originalFilterBackup;
      btnCompare.classList.remove('bg-primary', 'text-on-primary');
    };

    btnCompare.addEventListener('pointerup', resetCompare);
    btnCompare.addEventListener('pointerleave', resetCompare);

    // Category Tabs Switch
    categoryTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        categoryTabs.forEach(t => {
          t.classList.remove('active-tab', 'bg-primary', 'text-on-primary');
          t.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        tab.classList.remove('bg-surface-container', 'text-on-surface-variant');
        tab.classList.add('active-tab', 'bg-primary', 'text-on-primary');
      });
    });

    // Favorite heart toggle
    btnFav.addEventListener('click', () => {
      isFavorited = !isFavorited;
      const icon = btnFav.querySelector('span');
      if (isFavorited) {
        icon.style.fontVariationSettings = "'FILL' 1";
        btnFav.classList.add('text-primary');
        btnFav.classList.remove('text-on-surface-variant');
      } else {
        icon.style.fontVariationSettings = "'FILL' 0";
        btnFav.classList.remove('text-primary');
        btnFav.classList.add('text-on-surface-variant');
      }
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.6)]" data-active-classes="text-primary font-bold"><div class="flex justify-around items-center h-20 px-space-sm"><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="crop-mode" href="#"><span class="material-symbols-outlined text-[22px]">crop</span><span class="font-label-sm text-label-sm">Crop</span></a><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="adjust-mode" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-sm text-label-sm">Adjust</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min transition-colors text-primary font-bold" data-path="filters-mode" href="#"><span class="material-symbols-outlined text-[22px]">auto_awesome</span><span class="font-label-sm text-label-sm">Filters</span></a><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="blur-mode" href="#"><span class="material-symbols-outlined text-[22px]">lens_blur</span><span class="font-label-sm text-label-sm">Blur</span></a></div></nav></body></html>
