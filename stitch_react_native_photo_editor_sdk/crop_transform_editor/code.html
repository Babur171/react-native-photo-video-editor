</div>
<script>
  (function initCropWorkspace() {
    let currentAngle = -2.5;
    let rotationDeg = 0;
    let flipX = 1;
    let flipY = 1;

    const canvasImg = document.getElementById('canvas-image-wrap');
    const slider = document.getElementById('angle-slider');
    const degreeDisplay = document.getElementById('slider-degree-display');
    const canvasAngleText = document.getElementById('canvas-angle-text');
    const rulerStrip = document.getElementById('ruler-strip');
    const ratioLabel = document.getElementById('ratio-label');
    const ratioDesc = document.getElementById('active-preset-desc');
    const ratioChips = document.querySelectorAll('.ratio-chip');

    function updateTransform() {
      const totalAngle = currentAngle + rotationDeg;
      canvasImg.style.transform = `scale(1.08) rotate(${totalAngle}deg) scaleX(${flipX}) scaleY(${flipY})`;
      const formattedAngle = `${currentAngle > 0 ? '+' : ''}${currentAngle.toFixed(1)}°`;
      degreeDisplay.textContent = formattedAngle;
      canvasAngleText.textContent = formattedAngle;
      rulerStrip.style.transform = `translateX(${currentAngle * -1.8}px)`;
    }

    slider.addEventListener('input', (e) => {
      currentAngle = parseFloat(e.target.value);
      updateTransform();
    });

    document.getElementById('btn-zero-snap').addEventListener('click', () => {
      currentAngle = 0;
      slider.value = 0;
      updateTransform();
    });

    document.getElementById('btn-reset-angle').addEventListener('click', () => {
      currentAngle = 0;
      slider.value = 0;
      updateTransform();
    });

    document.getElementById('auto-straighten-btn').addEventListener('click', () => {
      currentAngle = 0.0;
      slider.value = 0.0;
      updateTransform();
      const badge = document.getElementById('auto-straighten-btn');
      badge.classList.add('bg-primary-container', 'text-on-primary-container');
      setTimeout(() => {
        badge.classList.remove('bg-primary-container', 'text-on-primary-container');
      }, 600);
    });

    document.getElementById('btn-rot-left').addEventListener('click', () => {
      rotationDeg = (rotationDeg - 90) % 360;
      updateTransform();
    });

    document.getElementById('btn-rot-right').addEventListener('click', () => {
      rotationDeg = (rotationDeg + 90) % 360;
      updateTransform();
    });

    document.getElementById('btn-flip-h').addEventListener('click', () => {
      flipX *= -1;
      updateTransform();
    });

    document.getElementById('btn-flip-v').addEventListener('click', () => {
      flipY *= -1;
      updateTransform();
    });

    document.getElementById('btn-reset-all').addEventListener('click', () => {
      currentAngle = 0;
      rotationDeg = 0;
      flipX = 1;
      flipY = 1;
      slider.value = 0;
      updateTransform();
    });

    // Aspect Ratio Selection Handling
    ratioChips.forEach(chip => {
      chip.addEventListener('click', () => {
        ratioChips.forEach(c => {
          c.classList.remove('bg-surface-container-highest', 'text-on-surface', 'shadow-[0_0_16px_rgba(124,58,237,0.45)]');
          c.classList.add('bg-surface-container-high', 'text-on-surface-variant');
          const previewIcon = c.querySelector('div > div');
          if (previewIcon) {
            previewIcon.classList.remove('bg-primary-container', 'shadow-sm');
            previewIcon.classList.add('bg-surface-container-highest');
            const spanText = previewIcon.querySelector('span');
            if (spanText) {
              spanText.classList.remove('text-on-primary-container', 'font-extrabold');
              spanText.classList.add('text-on-surface-variant');
            }
          }
          const labelSpan = c.querySelector('span:last-child');
          if (labelSpan) {
            labelSpan.classList.remove('font-bold', 'text-primary');
            labelSpan.classList.add('font-medium');
          }
        });

        chip.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
        chip.classList.add('bg-surface-container-highest', 'text-on-surface', 'shadow-[0_0_16px_rgba(124,58,237,0.45)]');

        const activeIcon = chip.querySelector('div > div');
        if (activeIcon) {
          activeIcon.classList.remove('bg-surface-container-highest');
          activeIcon.classList.add('bg-primary-container', 'shadow-sm');
          const spanText = activeIcon.querySelector('span');
          if (spanText) {
            spanText.classList.remove('text-on-surface-variant');
            spanText.classList.add('text-on-primary-container', 'font-extrabold');
          }
        }

        const activeLabelSpan = chip.querySelector('span:last-child');
        if (activeLabelSpan) {
          activeLabelSpan.classList.add('font-bold', 'text-primary');
          activeLabelSpan.classList.remove('font-medium');
        }

        ratioLabel.textContent = chip.getAttribute('data-label');
        ratioDesc.textContent = chip.getAttribute('data-desc');
      });
    });

    // Commit Action feedback
    document.getElementById('btn-apply-crop').addEventListener('click', function() {
      this.classList.add('scale-90');
      setTimeout(() => this.classList.remove('scale-90'), 150);
    });

    document.getElementById('btn-cancel-crop').addEventListener('click', function() {
      this.classList.add('scale-90');
      setTimeout(() => this.classList.remove('scale-90'), 150);
    });
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.6)]" data-active-classes="text-primary font-bold"><div class="flex justify-around items-center h-20 px-space-sm"><a aria-current="page" class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min transition-colors text-primary font-bold" data-path="crop-mode" href="#"><span class="material-symbols-outlined text-[22px]">crop</span><span class="font-label-sm text-label-sm">Crop</span></a><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="adjust-mode" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-sm text-label-sm">Adjust</span></a><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="filters-mode" href="#"><span class="material-symbols-outlined text-[22px]">auto_awesome</span><span class="font-label-sm text-label-sm">Filters</span></a><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="blur-mode" href="#"><span class="material-symbols-outlined text-[22px]">lens_blur</span><span class="font-label-sm text-label-sm">Blur</span></a></div></nav></body></html>
