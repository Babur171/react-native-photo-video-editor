<script>
  (function() {
    // Slider micro-interactions
    const blurSlider = document.getElementById('blur-slider');
    const blurVal = document.getElementById('blur-val');
    const blurBar = document.getElementById('blur-bar');
    const blurThumb = document.getElementById('blur-thumb');
    const blurLayer = document.getElementById('blur-layer');

    const featherSlider = document.getElementById('feather-slider');
    const featherVal = document.getElementById('feather-val');
    const featherBar = document.getElementById('feather-bar');
    const featherThumb = document.getElementById('feather-thumb');

    if (blurSlider && blurVal && blurBar && blurThumb) {
      blurSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        blurVal.textContent = val;
        blurBar.style.width = val + '%';
        blurThumb.style.left = val + '%';
        if (blurLayer) {
          const pxVal = (val / 100) * 12;
          blurLayer.style.filter = 'blur(' + pxVal + 'px)';
        }
      });
    }

    if (featherSlider && featherVal && featherBar && featherThumb) {
      featherSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        featherVal.textContent = val;
        featherBar.style.width = val + '%';
        featherThumb.style.left = val + '%';
      });
    }

    // Interactive Bokeh Shape Switcher
    const shapeBtns = document.querySelectorAll('.shape-btn');
    shapeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        shapeBtns.forEach(b => {
          b.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-md');
          b.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        btn.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-md');
        btn.classList.remove('bg-surface-container', 'text-on-surface-variant');
      });
    });

    // Interactive Mode Selector Tabs
    const modeTabs = document.querySelectorAll('.mode-tab');
    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        modeTabs.forEach(t => {
          t.classList.remove('bg-primary-container', 'text-on-primary-container', 'shadow-md');
          t.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        tab.classList.add('bg-primary-container', 'text-on-primary-container', 'shadow-md');
        tab.classList.remove('bg-surface-container', 'text-on-surface-variant');
      });
    });

    // Press & Hold Compare Functionality
    const compareBtn = document.getElementById('compare-btn');
    if (compareBtn && blurLayer) {
      const showOriginal = () => {
        blurLayer.dataset.originalFilter = blurLayer.style.filter || 'blur(6px)';
        blurLayer.style.filter = 'blur(0px)';
      };
      const restoreBlur = () => {
        blurLayer.style.filter = blurLayer.dataset.originalFilter || 'blur(6px)';
      };

      compareBtn.addEventListener('mousedown', showOriginal);
      compareBtn.addEventListener('mouseup', restoreBlur);
      compareBtn.addEventListener('touchstart', showOriginal, { passive: true });
      compareBtn.addEventListener('touchend', restoreBlur);
