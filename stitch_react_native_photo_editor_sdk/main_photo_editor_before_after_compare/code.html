<!-- Inline Micro-Interaction Script for Tactile Split Dragging -->
<script>
    (function () {
      const viewport = document.getElementById('compareViewport');
      const originalLayer = document.getElementById('originalLayer');
      const divider = document.getElementById('dividerHandle');
      const rawImage = document.getElementById('rawImage');
      let isDragging = false;

      function syncImageWidth() {
        if (viewport && rawImage) {
          const w = viewport.getBoundingClientRect().width;
          rawImage.style.width = w + 'px';
        }
      }

      function updateSplit(clientX) {
        if (!viewport || !originalLayer || !divider) return;
        const rect = viewport.getBoundingClientRect();
        let x = clientX - rect.left;
        let percent = (x / rect.width) * 100;
        if (percent < 5) percent = 5;
        if (percent > 95) percent = 95;

        originalLayer.style.width = percent + '%';
        divider.style.left = percent + '%';
      }

      window.addEventListener('resize', syncImageWidth);
      syncImageWidth();

      if (viewport) {
        viewport.addEventListener('pointerdown', (e) => {
          isDragging = true;
          viewport.setPointerCapture(e.pointerId);
          updateSplit(e.clientX);
        });

        viewport.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          updateSplit(e.clientX);
        });

        const release = (e) => {
          if (isDragging) {
            isDragging = false;
            try {
              viewport.releasePointerCapture(e.pointerId);
            } catch (err) {}
          }
        };

        viewport.addEventListener('pointerup', release);
        viewport.addEventListener('pointercancel', release);
      }
    })();
  </script>
