<button class="h-touch-target-min px-space-xl rounded-xl bg-primary hover:bg-primary-fixed-dim text-on-primary font-label-md text-label-md shadow-[0_4px_16px_rgba(210,187,255,0.25)] active:scale-95 transition-all flex items-center gap-space-xs">

<!-- Client-side Interactive Behaviors -->
<script>
  (function() {
    const slider = document.getElementById('temp-slider');
    const valueText = document.getElementById('param-value-text');
    const activeFill = document.getElementById('slider-active-fill');
    const knob = document.getElementById('slider-knob');
    const decBtn = document.getElementById('slider-dec');
    const incBtn = document.getElementById('slider-inc');
    const zeroBtn = document.getElementById('param-zero-btn');
    const resetAllBtn = document.getElementById('reset-all-btn');
    const compareBtn = document.getElementById('compare-btn');
    const compareBadge = document.getElementById('compare-badge');
    const viewportImage = document.getElementById('viewport-image');

    const editedFilter = "sepia(0.18) saturate(1.15) contrast(1.14) brightness(1.05)";
    const rawFilter = "none";

    function updateSlider(val) {
      const num = parseInt(val, 10);
      slider.value = num;
      valueText.textContent = (num > 0 ? '+' : '') + num;
      
      const pct = (num + 100) / 200; // 0 to 1
      knob.style.left = `calc(${pct * 100}% - 12px)`;

      if (num >= 0) {
        const widthPct = (num / 200) * 100;
        activeFill.style.left = '50%';
        activeFill.style.width = widthPct + '%';
      } else {
        const widthPct = (Math.abs(num) / 200) * 100;
        activeFill.style.left = (50 - widthPct) + '%';
        activeFill.style.width = widthPct + '%';
      }

      // Live adjust CSS warmth proxy on canvas image
      const warmFactor = (num / 100) * 0.4;
      const computedSepia = Math.max(0, 0.18 + warmFactor);
      viewportImage.style.filter = `sepia(${computedSepia}) saturate(1.15) contrast(1.14) brightness(1.05)`;
    }

    slider.addEventListener('input', (e) => updateSlider(e.target.value));

    decBtn.addEventListener('click', () => {
      let cur = parseInt(slider.value, 10);
      if (cur > -100) updateSlider(cur - 1);
    });

    incBtn.addEventListener('click', () => {
      let cur = parseInt(slider.value, 10);
      if (cur < 100) updateSlider(cur + 1);
    });

    zeroBtn.addEventListener('click', () => {
      updateSlider(0);
    });

    resetAllBtn.addEventListener('click', () => {
      updateSlider(0);
      viewportImage.style.filter = "none";
      setTimeout(() => {
        viewportImage.style.filter = editedFilter;
      }, 400);
    });

    // Hold to compare interaction
    function showOriginal() {
      viewportImage.style.filter = rawFilter;
      compareBadge.classList.remove('opacity-0');
      compareBadge.classList.add('opacity-100');
    }

    function restoreEdited() {
      updateSlider(slider.value);
      compareBadge.classList.remove('opacity-100');
      compareBadge.classList.add('opacity-0');
    }

    compareBtn.addEventListener('mousedown', showOriginal);
    window.addEventListener('mouseup', restoreEdited);
    compareBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showOriginal(); });
    window.addEventListener('touchend', restoreEdited);
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-1px_12px_rgba(0,0,0,0.6)]" data-active-classes="text-primary font-bold"><div class="flex justify-around items-center h-20 px-space-sm"><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="crop-mode" href="#"><span class="material-symbols-outlined text-[22px]">crop</span><span class="font-label-sm text-label-sm">Crop</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min transition-colors text-primary font-bold" data-path="adjust-mode" href="#"><span class="material-symbols-outlined text-[22px]">tune</span><span class="font-label-sm text-label-sm">Adjust</span></a><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="filters-mode" href="#"><span class="material-symbols-outlined text-[22px]">auto_awesome</span><span class="font-label-sm text-label-sm">Filters</span></a><a class="flex flex-col items-center justify-center gap-space-2xs w-touch-target-min h-touch-target-min text-on-surface-variant hover:text-on-surface transition-colors" data-path="blur-mode" href="#"><span class="material-symbols-outlined text-[22px]">lens_blur</span><span class="font-label-sm text-label-sm">Blur</span></a></div></nav></body></html>
